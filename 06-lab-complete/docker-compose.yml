# ============================================================
# Agent + Redis — một lệnh:  docker compose up --build
#   cp .env.example .env   (đặt AGENT_API_KEY; file .env không bắt buộc)
#   curl http://localhost:8000/health
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      PORT: "8000"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # lấy từ shell hoặc file .env cạnh compose (interpolation), không ghi giá trị ở đây
      AGENT_API_KEY: ${AGENT_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
